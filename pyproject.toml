[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-agent-scratch"
version = "0.1.0"
description = "A minimal coding agent built from scratch: agent loop, tools, skills, todos, permissions, sandbox, compaction and subagents. No frameworks, no SDK."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammad Hammas" }]
dependencies = []

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = ["pytest>=7", "ruff==0.16.7"]
# Only scripts/calibrate_tokens.py uses it, to count tokens with the real Qwen2.5
# tokenizer. The harness never imports it.
calibrate = ["tokenizers>=0.20"]

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# ruff's defaults plus the house set (pycodestyle, isort, pyupgrade, bugbear, simplify).
extend-select = ["E", "I", "UP", "B", "SIM"]
