name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Install
        # The locked dev group only (pytest, ruff); the harness itself has no dependencies.
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Tests
        # No model, no network: a scripted model drives the loop and the tools really run.
        run: uv run pytest -q

      - name: Scripted demo
        run: uv run python demo.py --scripted
